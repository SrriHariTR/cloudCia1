apiVersion: apps/v1
kind: Deployment
metadata:
  name: smart-cold-chain-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: smart-cold-chain-frontend
  template:
    metadata:
      labels:
        app: smart-cold-chain-frontend
    spec:
      containers:
        - name: frontend
          image: smart-cold-chain-frontend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 80
